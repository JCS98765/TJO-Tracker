<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TJO Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f3ec;--card:#fff;--ink:#1c2230;--mut:#69708a;--line:#e1ddd0;--acc:#2f6fdb;--ok:#2e9e5b;--semi:#d99a1c;--bad:#d1453b;--none:#8a90a3;--soft:#efece2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1120;--card:#171c2e;--ink:#e8ebf5;--mut:#9aa2bd;--line:#273049;--acc:#6aa0ff;--ok:#43c47a;--semi:#efb53a;--bad:#f0675c;--none:#7d84a0;--soft:#1f2640}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1120;--card:#171c2e;--ink:#e8ebf5;--mut:#9aa2bd;--line:#273049;--acc:#6aa0ff;--ok:#43c47a;--semi:#efb53a;--bad:#f0675c;--none:#7d84a0;--soft:#1f2640}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:"Cinzel",Georgia,serif;margin:0;letter-spacing:.02em}
h1{font-size:clamp(22px,4vw,30px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sub{color:var(--mut);margin:4px 0 0}
.mode{cursor:pointer;color:var(--ink);font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.mode.edit{border-color:var(--acc);color:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:18px 0 14px;padding-bottom:4px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer;font:inherit;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab small{opacity:.7;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.step{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.step:hover{border-color:var(--acc)}
.step .n{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.step h2{font-size:16px;margin:4px 0 6px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--soft);margin:10px 0 8px}
.bar i{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;background:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.c-active{background:var(--ok)}.c-semi{background:var(--semi)}.c-inactive{background:var(--bad)}.c-unreviewed{background:var(--none)}.c-purge{background:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
input,select,button{font:inherit}
input[type=text],input[type=date],select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
input[type=text]{min-width:0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);padding:5px 9px;font-weight:500}
.btn.ghost.arm{color:var(--bad);border-color:var(--bad)}
.fl{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 11px;cursor:pointer;font-size:13px}
.fl.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:1320px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.hidden{display:none}
td input[type=text],td input[type=date],td select{width:100%}
select[data-v=active]{border-color:var(--ok);color:var(--ok)}
select[data-v=semi]{border-color:var(--semi);color:var(--semi)}
select[data-v=inactive],select[data-v=purge]{border-color:var(--bad);color:var(--bad)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--soft);color:var(--mut)}
.badge.active{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.semi{background:color-mix(in srgb,var(--semi) 20%,transparent);color:var(--semi)}
.badge.inactive,.badge.purge{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.empty,.note{color:var(--mut);padding:18px;text-align:center}
.note{text-align:left;padding:0}
ol{margin:8px 0 0;padding-left:20px;color:var(--mut)}
textarea{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;resize:vertical;font:inherit}
.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;margin-bottom:10px}
.task.done{opacity:.65}
.trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.trow>select,.trow>input[type=date]{width:auto}
.late{color:var(--bad);font-weight:600}
.task p{margin:0;color:var(--mut);white-space:pre-wrap}
.gh{font-family:"Cinzel",Georgia,serif;font-size:15px;margin:20px 0 8px;display:block;cursor:default}
details>summary.gh{cursor:pointer}
.gh small{color:var(--mut);font-family:system-ui,sans-serif;font-weight:400}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;display:none;z-index:5}
.pl h3{font-family:"Cinzel",Georgia,serif;font-size:16px;margin:0 0 6px}
.pl p{margin:6px 0;color:var(--mut)}.pl p b{color:var(--ink)}
.pl ol,.pl ul{margin:6px 0;padding-left:20px;color:var(--mut)}.pl li{margin:2px 0}
.pl details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin-bottom:10px}
.pl details>summary{cursor:pointer;font-family:"Cinzel",Georgia,serif;font-size:17px;font-weight:700;padding:10px 0}
.pl details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.pl .tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--mut);font:600 12px system-ui,sans-serif;margin-left:6px}
.pl .flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.pl .flow span.s{padding:5px 11px;border-radius:99px;background:var(--acc);color:#fff;font-weight:600;font-size:13px}.pl .flow span.a{color:var(--mut)}
.pl .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}.pl .tbl table{min-width:640px}
.pl .tbl td,.pl .tbl th{vertical-align:top}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="toast"></div>
<script>
const COUNCILS=['Jedi Task Force','Jedi Peacekeepers','Librarians Assembly'];
const DIVS=['Jedi Assault Team','Temple Guard','Jedi Shadows'];
const OLDDIV={'Jedi Task Force':'Jedi Assault Team','Jedi Librarians':'Jedi Shadows','Librarians':'Jedi Shadows'};

const OLDC={'Council of Reconciliation':'Jedi Task Force','Council of Reassignment':'Jedi Peacekeepers','Council of First Knowledge':'Librarians Assembly',"Librarian's Assembly":'Librarians Assembly','Librarian’s Assembly':'Librarians Assembly'};
const nc=x=>OLDC[x]||x;
const ERR={taken:'That username is already taken.',password:'Passwords need at least 6 characters.',user:'Enter a name and a username (3–24 letters, numbers, dots, dashes or underscores).',limit:'Limit reached.',name:'Add a name first.',title:'Add a title first.',old:'Enter the old rank first.',missing:'That item no longer exists.'};
const CMAP={cor:COUNCILS[0],cora:COUNCILS[1],cofk:COUNCILS[2]};
const PLAN=[
{s:'Step 1',t:'High Ranks',d:'Who plans to be active and host events, and who has no interest (to be purged).',tab:'hr',f:''},
{s:'Step 2',t:COUNCILS[0],d:'Review every Jedi Assault Team member.',tab:'councils',f:COUNCILS[0]},
{s:'Step 3',t:COUNCILS[1],d:'Review every Jedi Peacekeeper member.',tab:'councils',f:COUNCILS[1]},
{s:'Step 4',t:COUNCILS[2],d:'Review every Librarians Assembly member.',tab:'councils',f:COUNCILS[2]},
{s:'Step 5',t:'Divisions',d:'Jedi Assault Team, Temple Guard and Jedi Shadows.',tab:'divisions',f:''}];
const TABINFO={
hr:{t:'High Ranks',d:'Who plans to be active and host events, and who has no interest (to be purged). Set a council or division here and they also appear on that tab.',sec:'hr',label:'High Rank'},
councils:{t:'Councils',d:'Members of the three councils. High Ranks with a council in their profile appear here automatically.',sec:'council',field:'council',opts:COUNCILS,label:'Council'},

const ST=[['unreviewed','Not reviewed'],['active','Active'],['semi','Semi-active'],['inactive','Inactive']];
const DEC=[['undecided','Undecided'],['retain','Retain'],['purge','Purge']];
const HOST=[['','—'],['yes','Yes'],['maybe','Maybe'],['no','No']];
const TST=[['todo','To do'],['doing','In progress'],['hold','On hold'],['done','Completed']];
const CATS=[['general','General TJO'],['council','Council tasks'],['division','Division tasks']];
const tcat=t=>t.category||'general';
function targetOpts(c){return c==='council'?[['','All councils'],...COUNCILS.map(x=>[x,x])]:c==='division'?[['','All divisions'],...DIVS.map(x=>[x,x])]:null}
const PRI=[['low','Low'],['normal','Normal'],['high','High']];
const $=s=>document.querySelector(s);
function h(t,p,...c){const e=document.createElement(t);for(const k in p||{}){const v=p[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else e.setAttribute(k,v)}for(const x of c.flat())if(x!=null)e.append(x);return e}
let owner=false,me=null,usr='',seats={},rules=[],decisions=[],events=[],users=[],hist=[],rf='*',evf='*',pw='',rows=[],tasks=[],tab='overview',cfilter='',dfilter='',search='',loading=true,err='',dirty=false,busy=0,last='',tfA='*',tfC='*',tfT='*',doneOpen=false;
function norm(r){
 const o={...r},g=o.group||'',fd=nd;
 if(CMAP[o.section]){if(o.council===undefined)o.council=CMAP[o.section];o.section='council'}
 else if(o.section==='div')o.section='division';
 if(o.council===undefined)o.council=COUNCILS.includes(g)?g:'';
 if(o.division===undefined)o.division=DIVS.includes(fd(g))?fd(g):'';
 else o.division=nd(o.division);
 if(o.council)o.council=nc(o.council);
 return o;
}
function members(t,f){return rows.filter(r=>t==='hr'?r.section==='hr':t==='councils'?(f?r.council===f:(r.section==='council'||!!r.council)):(f?r.division===f:(r.section==='division'||!!r.division)))}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
async function api(body,pass,user){
 const r=await fetch('/api/people',{method:'POST',headers:{'content-type':'application/json','x-admin-password':pass??pw,'x-user':user??usr},body:JSON.stringify(body)});
 if(r.status===401){const e=new Error('auth');e.auth=true;throw e}
 if(r.status===403){const e=new Error('perm');e.perm=true;throw e}
 if(!r.ok){let m='';try{m=(await r.json()).error}catch{}const e=new Error(m||'http '+r.status);e.code=m;throw e}
 return r.json();
}
function apply(d){
 if(d.me)me=d.me;
 if(d.users)users=d.users;
 const s=JSON.stringify([d.people,d.tasks,d.seats,d.rules,d.decisions,d.events]);
 const chg=s!==last;
 if(chg){last=s;rows=(d.people||[]).map(norm);tasks=(d.tasks||[]).map(t=>({...t,target:t.category==='division'?nd(t.target||''):t.category==='council'?nc(t.target||''):(t.target||'')}));seats=d.seats||{};rules=d.rules||[];decisions=d.decisions||[];events=d.events||[]}
 if(chg||d.users)schedule();
}
async function write(body){
 busy++;
 try{const d=await api(body);apply(d);if(tab==='history')loadHist()}
 catch(e){if(e.auth){doLogout();toast('Session expired. Log in again.');render()}else if(e.perm){toast('Your account can’t make that change.');pull()}else{toast(ERR[e.code]||'Could not save. Check your connection and try again.');if(e.code==='missing')pull()}}
 finally{busy--}
}
function save(id,patch){const r=rows.find(x=>x.id===id);if(r)Object.assign(r,patch);write({op:'update',id,patch})}
function saveTask(id,patch){const t=tasks.find(x=>x.id===id);if(t)Object.assign(t,patch);write({op:'updateTask',id,patch})}
function doLogout(){owner=false;me=null;pw='';usr='';users=[];hist=[];try{sessionStorage.removeItem('tjo-auth')}catch{}if(tab==='history'||tab==='users')tab='overview'}
async function login(){
 const u0=prompt('Username (leave blank for the owner)');if(u0===null)return;
 const u=u0.trim().toLowerCase(),p=prompt(u?'Password for '+u:'Owner password');if(!p)return;
 try{const d=await api({op:'check'},p,u);pw=p;usr=u;owner=true;try{sessionStorage.setItem('tjo-auth',JSON.stringify([u,p]))}catch{}apply(d);render()}

}
function logout(){doLogout();render()}
function counts(l){const c={unreviewed:0,active:0,semi:0,inactive:0,purge:0};l.forEach(r=>{c[r.status||'unreviewed']++;if(r.decision==='purge')c.purge++});return c}
function typing(){const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')}
function schedule(){if(typing())dirty=true;else render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirty&&!typing()){dirty=false;render()}},0));
function sel(opts,val,fn,v){const s=h('select',{onchange:e=>{e.target.dataset.v=e.target.value;fn(e.target.value)}},opts.map(o=>h('option',{value:o[0]},o[1])));s.value=val;if(v)s.dataset.v=val;return s}
function chipsFor(c){return h('div',{class:'chips'},ST.map(([k,l])=>h('span',{class:'chip'},h('i',{class:'dot c-'+k}),c[k]+' '+l.toLowerCase())),c.purge?h('span',{class:'chip'},h('i',{class:'dot c-purge'}),c.purge+' to purge'):null)}
function barFor(c,t){return h('div',{class:'bar'},['active','semi','inactive','unreviewed'].map(k=>h('i',{class:'c-'+k,style:'width:'+(t?c[k]/t*100:0)+'%'})))}
function go(t,f){tab=t;if(t==='history')loadHist();if(t==='users')loadUsers();if(t==='councils')cfilter=f||'';if(t==='divisions')dfilter=f||'';search='';render();scrollTo(0,0)}
function armBtn(label,fn){return h('button',{class:'btn ghost',onclick:e=>{const b=e.target;if(b.classList.contains('arm'))fn();else{b.classList.add('arm');b.textContent='Sure?';setTimeout(()=>{b.classList.remove('arm');b.textContent=label},3000)}}},label)}

function header(){
 return h('div',{class:'top'},
  h('div',null,h('h1',null,'The Jedi Order: Tracker'),h('p',{class:'sub'},'Personnel review for TJO. Updates appear for everyone within seconds.')),
  owner?h('button',{class:'mode edit',onclick:logout,title:'Click to log out'},(me?me.name:'Edit')+' · log out'):h('button',{class:'mode',onclick:login},'View only · Log in'));
}
function tabs(){
 const mk=(id,l,n)=>h('button',{class:'tab'+(tab===id?' on':''),onclick:()=>go(id)},l,n!=null?h('small',null,String(n)):null);
 return h('div',{class:'tabs'},mk('overview','Overview'),mk('hr','High Ranks',members('hr').length),mk('councils','Councils',members('councils').length),mk('divisions','Divisions',members('divisions').length),mk('roadmap','Roadmap',tasks.filter(t=>t.status!=='done').length),mk('ranks','Rank map'),mk('seats','Seats'),mk('events','Events'),mk('planner','Planner'),owner?mk('history','History'):null,me&&me.role==='owner'?mk('users','Users'):null);
}
function overview(){
 const all=counts(rows);
 const cards=PLAN.map(p=>{const l=members(p.tab,p.f),c=counts(l),rev=l.length-c.unreviewed;
  return h('button',{class:'card step',onclick:()=>go(p.tab,p.f)},
   h('div',{class:'n'},p.s),h('h2',null,p.t),h('div',{class:'sub'},p.d),barFor(c,l.length),
   h('div',{class:'sub'},l.length?rev+' of '+l.length+' reviewed':'No personnel added yet'),chipsFor(c))});
 const open=tasks.filter(t=>t.status!=='done').length;
 cards.push(...extraCards());cards.push(h('button',{class:'card step',onclick:()=>go('roadmap')},h('div',{class:'n'},'Roadmap'),h('h2',null,'TJO roadmap'),h('div',{class:'sub'},'Tasks assigned to each High Rank.'),h('div',{class:'sub',style:'margin-top:8px'},tasks.length?open+' open · '+(tasks.length-open)+' done':'No tasks yet')));
 return h('div',null,
  h('div',{class:'card'},h('h2',{style:'font-size:18px'},'Plans'),
   h('ol',null,PLAN.map(p=>h('li',null,h('b',{style:'color:var(--ink)'},p.t+': '),p.d))),
   barFor(all,rows.length),h('div',{class:'sub'},rows.length+' people tracked in total'),chipsFor(all)),
  h('div',{style:'height:12px'}),h('div',{class:'grid'},cards),
  h('p',{class:'sub',style:'margin-top:14px'},owner?'Open a tab to add people and set their status. Everything you change saves for all viewers.':'You can view everything here, but only the tracker owner can make changes.'));
}
function section(id){
 const I=TABINFO[id],f=id==='councils'?cfilter:id==='divisions'?dfilter:'';

 const out=h('div',null,h('h2',{style:'font-size:20px'},I.t),h('p',{class:'sub'},I.d));
 const c=counts(list);out.append(barFor(c,list.length),chipsFor(c));

 if(I.opts){const setF=v=>{if(id==='councils')cfilter=v;else dfilter=v;render()};
  tools.append(h('button',{class:'fl'+(!f?' on':''),onclick:()=>setF('')},'All ('+all.length+')'),...I.opts.map(o=>h('button',{class:'fl'+(f===o?' on':''),onclick:()=>setF(o)},o+' ('+members(id,o).length+')')))}
 const si=h('input',{type:'text',placeholder:'Search name, rank, notes…',value:search,oninput:e=>{search=e.target.value.toLowerCase();document.querySelectorAll('tr[data-q]').forEach(tr=>tr.classList.toggle('hidden',!tr.dataset.q.includes(search)))}});

 if(owner){const ni=h('input',{type:'text',placeholder:'New person name'});
  const add=()=>{const n=ni.value.trim();if(!n)return;ni.value='';const person={name:n,section:I.sec};if(I.field)person[I.field]=f;write({op:'add',person})};

 const copts=[['','None'],...COUNCILS.map(x=>[x,x])],dopts=[['','None'],...DIVS.map(x=>[x,x])];
 const head=h('tr',null,['#','Name',id!=='hr'?'Listed as':null,'Roblox username','Current rank','Council','Division','Status','Last active','Hosts events','Decision','Notes',''].filter(Boolean).map(x=>h('th',null,x)));
 const body=list.map((r,i)=>{
  const tr=h('tr',{'data-q':[r.name,r.roblox,r.rank,r.notes,r.council,r.division].join(' ').toLowerCase()});
  tr.classList.toggle('hidden',!!search&&!tr.dataset.q.includes(search));
  const T=(k,ph,ty)=>owner?h('input',{type:ty||'text',value:r[k]||'',placeholder:ph,onchange:e=>save(r.id,{[k]:e.target.value.trim()})}):(r[k]||'—');
  const label=(opts,v)=>(opts.find(o=>o[0]===v)||opts[0])[1];
  const S=(opts,k,def,badge)=>owner?sel(opts,r[k]||def,v=>save(r.id,{[k]:v}),badge):h('span',{class:'badge '+(badge?(r[k]||def):'')},label(opts,r[k]||def));
  const own=id==='hr'||r.section===I.sec;
  const del=owner?(own?armBtn('Remove',()=>{rows=rows.filter(x=>x.id!==r.id);render();write({op:'delete',id:r.id})}):armBtn('Unlist',()=>{save(r.id,{[I.field]:''});render()})):'';
  const cells=[h('td',{style:'color:var(--mut)'},String(i+1)),h('td',null,T('name','Name'))];
  if(id!=='hr')cells.push(h('td',null,h('span',{class:'badge'},TABINFO[r.section==='council'?'councils':r.section==='division'?'divisions':'hr'].label)));

 const list=events.filter(e=>evf==='*'||(e.branch||'')===evf).sort((a,b)=>key(a)>key(b)?1:-1),t=todayS();
 const up=list.filter(e=>e.status==='planned'&&(!e.date||e.date>=t)),past=list.filter(e=>!up.includes(e)).reverse();
 const view=e=>h('div',{class:'task'+(e.status!=='planned'?' done':'')},h('div',{class:'trow'},h('b',{style:'flex:1 1 220px'},e.title),h('span',{class:'badge'},(EVT.find(x=>x[0]===e.type)||EVT[4])[1]),h('span',{class:'badge'},e.branch?BRN[e.branch]:'Whole Order'),e.date?h('span',{class:'sub'},e.date+(e.time?' · '+e.time:'')):null,e.host?h('span',{class:'sub'},'Host: '+e.host):null,e.status!=='planned'?h('span',{class:'badge'},(EST.find(x=>x[0]===e.status)||EST[0])[1]):null),e.details?h('p',null,e.details):null);
 out.append(h('h3',{class:'gh'},'Upcoming ',h('small',null,'('+up.length+')')));
 out.append(up.length?h('div',null,up.map(e=>ecard('events',e,EF,view))):h('div',{class:'card empty'},'No upcoming events.'));
 if(past.length)out.append(h('details',null,h('summary',{class:'gh'},'Past, done and cancelled ',h('small',null,'('+past.length+')')),past.map(e=>ecard('events',e,EF,view))));
 return out}

const DST=[['pending','Pending'],['approved','Approved'],['rejected','Rejected'],['revisit','Revisit']];
const DF=[['title','text',0,'Decision or question','flex:1 1 240px'],['date','date'],['status','sel',DST],['by','text',0,'Decided by'],['details','area',0,'Context, outcome, next steps…']];
function decisionsLog(){
 const l=decisions.slice().sort((a,b)=>(b.date||'')>(a.date||'')?1:-1);
 const view=d=>h('div',{class:'task'},h('div',{class:'trow'},h('b',{style:'flex:1 1 240px'},d.title),h('span',{class:'badge '+(d.status==='approved'?'active':d.status==='rejected'?'purge':d.status==='revisit'?'semi':'')},(DST.find(x=>x[0]===d.status)||DST[0])[1]),d.date?h('span',{class:'sub'},d.date):null,d.by?h('span',{class:'sub'},'By '+d.by):null),d.details?h('p',null,d.details):null);

const VERB={add:'added',update:'edited',delete:'removed',revert:'reverted'},CNAME={people:'person',tasks:'task',rules:'rank rule',decisions:'decision',events:'event',seats:'seat',users:'user'};
async function loadHist(){try{const d=await api({op:'history'});hist=d.history||[];render()}catch(e){if(e.auth){doLogout();render()}}}
function histText(e){
 if(e.op==='bulk')return e.label;
 if(e.coll==='seats'){const[k,id]=e.id.split(':'),i=BK.indexOf(k);return 'set '+(i<0?e.id:PL.branches[i].n+' · '+((seatDefs(i).find(x=>x[0]===id)||[0,id])[1]))+' to '+e.label}
 return VERB[e.op]+' '+CNAME[e.coll]+' “'+e.label+'”'+(e.sum?' ('+e.sum+')':'')}
function historyTab(){
 const out=h('div',null,...H2('Change history','Every change made while logged in, newest first.'+(me&&me.role==='owner'?' As owner you can revert additions, edits and removals.':'')));
 if(!hist.length){out.append(h('div',{class:'card empty'},'No changes recorded yet.'));return out}
 const own=me&&me.role==='owner';
 out.append(tbl(['When','Who','Change',''],hist.map(e=>h('tr',null,h('td',{style:'white-space:nowrap'},new Date(e.t).toLocaleString()),h('td',null,e.who),h('td',null,histText(e)),h('td',null,e.reverted?h('span',{class:'badge'},'Reverted'):own&&['add','update','delete'].includes(e.op)&&e.coll!=='users'?armBtn('Revert',()=>write({op:'revert',hid:e.hid})):''))),720));
 return out}

const SC=[['hr','High Ranks, general tasks and anything not tied to a branch'],['tf',COUNCILS[0]+': its council, Jedi Assault Team, committees and seats'],['pk',COUNCILS[1]+': its council, Temple Guard, committees and seats'],['la',COUNCILS[2]+': its council, Jedi Shadows, committees and seats'],['events','All events'],['planner','Decisions log']];
async function loadUsers(){try{const d=await api({op:'users'});users=d.users||[];render()}catch(e){if(e.auth){doLogout();render()}}}
function userCard(u){
 const v={name:u.name||'',username:u.username||'',password:'',scopes:[...(u.scopes||[])]};
 const f=(k,ph,ty)=>h('input',{type:ty||'text',placeholder:ph,value:v[k],autocomplete:'off',onchange:e=>{v[k]=e.target.value.trim()}});
 const cb=SC.map(([k,l])=>h('label',{class:'sub',style:'display:flex;gap:6px;align-items:flex-start'},h('input',{type:'checkbox',...(v.scopes.includes(k)?{checked:''}:{}),onchange:e=>{v.scopes=v.scopes.filter(x=>x!==k);if(e.target.checked)v.scopes.push(k)}}),l));
 return h('div',{class:u.id?'task':'card',style:u.id?'':'margin:12px 0;display:grid;gap:8px'},h('div',{class:'trow'},f('name','Display name'),f('username','username'),f('password',u.id?'New password (optional)':'Password (6+ characters)','password')),h('div',{style:'display:grid;gap:4px'},cb),
  h('div',{class:'trow'},h('button',{class:'btn',onclick:()=>write({op:'userSave',user:{id:u.id,...v}})},u.id?'Save':'Add user'),u.id?armBtn('Delete user',()=>write({op:'userDel',id:u.id})):null))}
function usersTab(){
 const out=h('div',null,...H2('Users','Give each lead their own login. The owner password (the ADMIN_PASSWORD secret) always has access to everything, and only it can manage users and revert history.'));
 if(!me||me.role!=='owner'){out.append(h('div',{class:'card empty'},'Only the owner can manage users.'));return out}
 out.append(h('h3',{class:'gh'},'Add a user'),userCard({}),h('h3',{class:'gh'},'Users ',h('small',null,'('+users.length+')')));
 out.append(users.length?h('div',null,users.map(userCard)):h('div',{class:'card empty'},'No users yet.'));
 return out}
const TABS={planner,ranks:ranksTab,seats:seatsTab,events:eventsTab,history:historyTab,users:usersTab};
function body(){
 if(err)return h('div',{class:'card empty'},'Could not load the tracker. Refresh the page to try again.');
 if(loading)return h('div',{class:'card empty'},'Loading the tracker…');
 return tab==='overview'?overview():tab==='roadmap'?roadmap():(TABS[tab]||(()=>section(tab)))();
}
function render(){$('#app').replaceChildren(header(),tabs(),body())}
async function pull(){
 try{const r=await fetch('/api/people',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();loading=false;err='';apply(d)}
 catch{if(loading){loading=false;err='x';render()}}
}
render();
(async()=>{
 try{const a=JSON.parse(sessionStorage.getItem('tjo-auth')||'null');if(a){const d=await api({op:'check'},a[1],a[0]);usr=a[0];pw=a[1];owner=true;loading=false;apply(d)}}catch{try{sessionStorage.removeItem('tjo-auth')}catch{}}
 await pull();render();
 setInterval(()=>{if(!typing()&&!busy&&!document.hidden)pull()},15000);
})();
</script>
